name: runner

# Dauer-Job: prüft alle 5 Minuten, ob etwas fällig ist (Quoten holen, Wetten platzieren,
# Schlussquoten erfassen, abrechnen). Jeder Lauf dauert knapp 6 Stunden. Der Zeitplan alle
# 30 Minuten ist nur der Wachhund: Dank der Warteschlange (concurrency) steht immer schon der
# nächste Lauf bereit und startet direkt, wenn der aktuelle endet.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Nachfolger sofort in die Warteschlange stellen: startet, sobald dieser Lauf endet.
      - name: Nächsten Lauf vormerken
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run runner.yml --ref main || echo "::warning::Nachfolger konnte nicht vorgemerkt werden"
      - name: Schleife
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          RUN_SECONDS: "20400"
          INTERVAL: "300"
        run: bash scripts/runner.sh
