name: tick

# Alle 20 Minuten: fällige Schritte ausführen (Quoten holen, Wetten platzieren,
# Schlussquoten erfassen, abrechnen) und Ergebnisse ins Repo committen.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      cmd:
        description: "tick | prepare | pick | settle | build"
        default: tick
      day:
        description: "Tag (YYYY-MM-DD), optional"
        default: ""

permissions:
  contents: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Die Claude-Routine pusht Recherche/Analysen evtl. auf claude/*-Branches:
      # nur diese Dateien nach main übernehmen.
      - name: Claude-Ergebnisse übernehmen
        run: |
          git fetch origin '+refs/heads/claude/*:refs/remotes/origin/claude/*' || true
          for b in $(git for-each-ref --sort=committerdate --format='%(refname:short)' refs/remotes/origin/claude/); do
            files=$(git diff --name-only HEAD "$b" -- 'data/days/*/adjustments.json' 'data/analyses/*.json' || true)
            for f in $files; do
              if git cat-file -e "$b:$f" 2>/dev/null; then
                mkdir -p "$(dirname "$f")"; git show "$b:$f" > "$f"; echo "übernommen: $f aus $b"
              fi
            done
          done

      - name: Engine
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: |
          CMD="${{ github.event.inputs.cmd || 'tick' }}"
          DAY="${{ github.event.inputs.day }}"
          if [ -n "$DAY" ]; then python -m engine.run "$CMD" --day "$DAY"; else python -m engine.run "$CMD"; fi

      - name: Commit
        run: |
          # Als Repo-Besitzer committen: Vercel (Hobby) deployt bei privaten Repos nur Commits von Projektmitgliedern
          git config user.name "rdbelean"
          git config user.email "171094272+rdbelean@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "Daten-Update $(TZ=Europe/Berlin date '+%a %d.%m. %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
